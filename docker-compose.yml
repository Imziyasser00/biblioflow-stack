name: biblioflow

networks:
  biblio_front:
  biblio_back:

volumes:
  pgdata:
  mongodata:

services:
  proxy:
    image: nginx:alpine
    depends_on:
      ui:
        condition: service_started
      backend:
        condition: service_healthy
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [biblio_front, biblio_back]

  ui:
    image: biblioflow-ui:prod
    networks: [biblio_front]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ | grep -q '<app-root'"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    image: biblioflow-api:prod
    environment:
      PORT: ${API_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      MONGODB_URL: mongodb://${MONGODB_USER}:${MONGODB_PASS}@mongo:27017/${MONGODB_DB}?authSource=${MONGODB_DB}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks: [biblio_back]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init/postgres:/docker-entrypoint-initdb.d:ro
    networks: [biblio_back]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    command: ["--auth"]
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB}
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpw
    volumes:
      - mongodata:/data/db
      - ./db-init/mongo:/docker-entrypoint-initdb.d:ro
    networks: [biblio_back]
    healthcheck:
      test: ["CMD", "mongosh", "--username", "root", "--password", "rootpw", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
