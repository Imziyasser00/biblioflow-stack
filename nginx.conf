events {}
http {
  server {
    listen 80;
    server_name localhost;

    location / {
      proxy_pass http://ui:80;
      proxy_set_header Host $host;
    }

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }
  }
}
